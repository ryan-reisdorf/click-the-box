<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Coconuts from the Palm Tree</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Press Start 2P', monospace;
    background: #000000;
    color: #ffffff;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    image-rendering: pixelated;
  }
  #app { width: 100%; height: 100%; position: relative; }
  #app::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.05) 0px,
      rgba(255,255,255,0.05) 1px,
      transparent 1px,
      transparent 3px
    );
    mix-blend-mode: overlay;
    z-index: 50;
  }
  .screen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    padding: 24px;
    text-align: center;
  }
  h1 { font-size: 28px; margin: 0; letter-spacing: 0.08em; }
  p { color: #bbbbbb; margin: 0; max-width: 420px; font-size: 12px; line-height: 1.8; }
  .btn {
    font-family: 'Press Start 2P', monospace;
    background: #000000;
    color: #ffffff;
    border: 3px solid #ffffff;
    padding: 14px 22px;
    border-radius: 0;
    font-size: 13px;
    cursor: pointer;
    box-shadow: 4px 4px 0 #ffffff;
    transition: transform 0.05s ease;
  }
  .btn:hover { background: #ffffff; color: #000000; }
  .btn:active { transform: translate(4px, 4px); box-shadow: 0 0 0 #ffffff; }

  /* --- 8-bit glitch title (shared) --- */
  .arcade-title-wrap { position: relative; line-height: 1.6; }
  .arcade-title {
    font-size: 22px;
    margin: 0;
    color: #ffffff;
    letter-spacing: 0.1em;
    position: relative;
    display: inline-block;
    animation: flicker 4s infinite steps(1);
    text-shadow: 3px 0 0 #000000, -3px 0 0 #000000, 0 3px 0 #000000, 0 -3px 0 #000000, 4px 4px 0 #ffffff;
  }
  .arcade-title::before, .arcade-title::after {
    content: attr(data-text);
    position: absolute; left: 0; top: 0; width: 100%; overflow: hidden; color: #ffffff;
  }
  .arcade-title::before { animation: glitchTop 5s infinite linear; clip-path: inset(0 0 60% 0); transform: translate(-2px, -1px); }
  .arcade-title::after { animation: glitchBottom 6s infinite linear; clip-path: inset(60% 0 0 0); transform: translate(2px, 1px); }
  @keyframes flicker { 0%, 92%, 100% { opacity: 1; } 93% { opacity: 0.3; } 94% { opacity: 1; } 95% { opacity: 0.5; } 96% { opacity: 1; } }
  @keyframes glitchTop { 0%, 89%, 100% { transform: translate(-2px, -1px); opacity: 0; } 90% { transform: translate(-6px, -2px); opacity: 0.8; } 91% { transform: translate(3px, -1px); opacity: 0.8; } 92% { transform: translate(-2px, -1px); opacity: 0; } }
  @keyframes glitchBottom { 0%, 79%, 100% { transform: translate(2px, 1px); opacity: 0; } 80% { transform: translate(6px, 2px); opacity: 0.8; } 81% { transform: translate(-3px, 1px); opacity: 0.8; } 82% { transform: translate(2px, 1px); opacity: 0; } }
  .insert-coin {
    font-size: 11px; color: #ffffff; margin-top: -6px;
    animation: coinBlink 1.2s steps(1) infinite; letter-spacing: 0.15em;
  }
  @keyframes coinBlink { 0%, 50% { opacity: 1; } 50.01%, 100% { opacity: 0.15; } }

  /* --- click ripple (shared) --- */
  .click-ripple {
    position: absolute; width: 10px; height: 10px; border: 2px solid #ffffff;
    pointer-events: none; transform: translate(-50%, -50%); z-index: 999;
    animation: rippleOut 0.35s ease-out forwards;
  }
  @keyframes rippleOut { 0% { width: 6px; height: 6px; opacity: 1; } 100% { width: 36px; height: 36px; opacity: 0; } }

  /* --- banner (shared) --- */
  .level-banner {
    position: absolute; top: 32px; left: 50%; transform: translateX(-50%);
    text-align: center; z-index: 20;
  }
  .level-banner .banner-title {
    font-size: 14px; letter-spacing: 0.12em; color: #ffffff;
    border: 2px solid #ffffff; padding: 10px 18px; background: #000000; box-shadow: 3px 3px 0 #ffffff;
  }
  .level-banner .banner-instructions { margin-top: 14px; font-size: 10px; color: #bbbbbb; letter-spacing: 0.05em; }

  /* --- coconut counter --- */
  .coconut-counter {
    position: absolute; top: 32px; right: 32px; z-index: 20;
    font-size: 14px; letter-spacing: 0.12em; color: #ffffff;
    border: 2px solid #ffffff; padding: 10px 16px; background: #000000; box-shadow: 3px 3px 0 #ffffff;
  }

  /* --- palm tree scene --- */
  .tree-scene { position: absolute; inset: 0; }
  .ground { position: absolute; bottom: 0; left: 0; width: 100%; height: 6px; background: #ffffff; }

  /* The palm is drawn as outlined (hollow) pixel shapes — black/white only,
     matching a stepped base, thin trunk, and long drooping outlined fronds. */
  .palm {
    position: absolute;
    bottom: 6px; left: 50%;
    transform: translateX(-50%);
    width: 360px; height: 60vh; max-height: 520px;
    z-index: 5;
  }

  /* stepped base — tiered pedestal */
  .palm .base-1 { position: absolute; bottom: 0;  left: 50%; transform: translateX(-50%); width: 150px; height: 12px; border: 4px solid #ffffff; background: #000000; }
  .palm .base-2 { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); width: 110px; height: 12px; border: 4px solid #ffffff; background: #000000; }

  /* thin trunk */
  .palm .trunk {
    position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
    width: 16px; height: calc(100% - 24px - 30%);
    border-left: 4px solid #ffffff;
    border-right: 4px solid #ffffff;
    background: #000000;
  }

  /* crown anchor at top of trunk */
  .palm .crown {
    position: absolute; top: 26%; left: 50%;
    transform: translateX(-50%);
    width: 0; height: 0; z-index: 6;
  }
  /* each frond is a long, thin, outlined (hollow) curved blade */
  .frond {
    position: absolute;
    width: 130px; height: 26px;
    border: 4px solid #ffffff;
    background: #000000;
    border-radius: 0 80% 0 80%;
    top: 0; left: 0;
    transform-origin: 8% 50%;
  }
  .frond.f1 { transform: rotate(-2deg); }
  .frond.f2 { transform: rotate(34deg); }
  .frond.f3 { transform: rotate(70deg); width: 110px; }
  .frond.f4 { transform: rotate(182deg) scaleY(-1); }
  .frond.f5 { transform: rotate(150deg) scaleY(-1); }
  .frond.f6 { transform: rotate(110deg) scaleY(-1); width: 110px; }
  .palm .crown-center {
    position: absolute; top: -8px; left: -8px;
    width: 16px; height: 16px; border: 4px solid #ffffff; background: #000000; border-radius: 50%;
    z-index: 7;
  }

  /* --- coconuts --- */
  .coconut {
    position: absolute;
    width: 30px; height: 30px;
    transform: translate(-50%, -50%);
    cursor: default;
    z-index: 8;
  }
  .coconut .body {
    border-radius: 50%;
    position: relative;
    margin: 0 auto;
    border: 2px solid #cfcfcf;
    background: #1a1a1a;
    transition: width 0.8s linear, height 0.8s linear;
  }
  /* ripe looks almost identical to a fully-grown unripe coconut — the
     only reliable tell is the one-time shine flash at the moment it ripens. */
  .coconut.ripe { cursor: pointer; }
  .coconut.ripe .body {
    border: 2px solid #d6d6d6;
    background: #1c1c1c;
  }
  /* shine sweep — one-time on ripen, the sole clear indicator */
  .coconut .shine {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    border-radius: 50%; overflow: hidden; pointer-events: none; opacity: 0;
  }
  .coconut.just-ripened .shine { animation: shineFlash 0.9s ease-out 1; }
  @keyframes shineFlash {
    0% { opacity: 0; box-shadow: 0 0 0 0 rgba(255,255,255,0.9); }
    25% { opacity: 1; box-shadow: 0 0 16px 6px rgba(255,255,255,1); }
    100% { opacity: 0; box-shadow: 0 0 0 0 rgba(255,255,255,0); }
  }
  /* falling */
  .coconut.falling { animation: coconutFall 1.0s ease-in forwards; pointer-events: none; }
  @keyframes coconutFall {
    0% { transform: translate(-50%, -50%) rotate(0deg); opacity: 1; }
    100% { transform: translate(-50%, 520px) rotate(180deg); opacity: 0; }
  }
  /* claimed pop */
  .coconut.claimed { animation: coconutClaim 0.4s ease-out forwards; pointer-events: none; }
  @keyframes coconutClaim {
    0% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    100% { transform: translate(-50%, -90%) scale(1.6); opacity: 0; }
  }
</style>
</head>
<body>
<div id="app"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script>
const { useState, useEffect, useRef } = React;
const e = React.createElement;

// Timing (real-time)
const RIPEN_MIN_MS = 25 * 60 * 1000; // 25 min
const RIPEN_MAX_MS = 30 * 60 * 1000; // 30 min
const RIPE_WINDOW_MS = 5 * 60 * 1000; // 5 min

// 8 fixed slot positions clustered under the crown of the palm (percentages).
const SLOT_POSITIONS = [
  { x: 44, y: 16 }, { x: 50, y: 14 }, { x: 56, y: 16 },
  { x: 41, y: 21 }, { x: 59, y: 21 },
  { x: 47, y: 23 }, { x: 53, y: 23 }, { x: 50, y: 19 }
];

function randomRipenTime() {
  return RIPEN_MIN_MS + Math.random() * (RIPEN_MAX_MS - RIPEN_MIN_MS);
}

function LevelBanner({ title, instructions }) {
  return e('div', { className: 'level-banner' },
    e('div', { className: 'banner-title' }, title),
    instructions && e('div', { className: 'banner-instructions' }, instructions)
  );
}

function Coconut({ slot, phase, justRipened, anim, sizePx, onClaim }) {
  // phase: 'unripe' | 'ripe' ; anim: null | 'falling' | 'claimed'
  let cls = 'coconut ';
  if (anim === 'falling') cls += 'falling ';
  else if (anim === 'claimed') cls += 'claimed ';
  else cls += (phase === 'ripe' ? 'ripe ' : 'unripe ');
  if (justRipened && anim === null) cls += 'just-ripened ';

  function handleClick(ev) {
    if (phase === 'ripe' && anim === null) {
      ev.stopPropagation();
      onClaim();
    }
  }

  return e('div', {
    className: cls,
    style: { left: slot.x + '%', top: slot.y + '%' },
    onClick: handleClick
  },
    e('div', { className: 'body', style: { width: sizePx + 'px', height: sizePx + 'px' } }),
    e('div', { className: 'shine' })
  );
}

function GameScreen({ count, setCount }) {
  const [slots, setSlots] = useState(() =>
    SLOT_POSITIONS.map(() => {
      const now = Date.now();
      const ripenDur = randomRipenTime();
      return {
        phase: 'unripe',
        startedAt: now,
        ripenAt: now + ripenDur,
        ripeUntil: null,
        justRipened: false,
        anim: null
      };
    })
  );
  const slotsRef = useRef(slots);
  slotsRef.current = slots;
  const [, setTickNow] = useState(0);

  // Main tick: handle ripening and falling.
  useEffect(() => {
    const interval = setInterval(() => {
      const now = Date.now();
      setSlots(prev => prev.map(s => {
        if (s.anim) return s;
        if (s.phase === 'unripe' && now >= s.ripenAt) {
          return { ...s, phase: 'ripe', ripeUntil: now + RIPE_WINDOW_MS, justRipened: true };
        }
        if (s.phase === 'ripe' && now >= s.ripeUntil) {
          return { ...s, anim: 'falling' };
        }
        return s;
      }));
    }, 500);
    return () => clearInterval(interval);
  }, []);

  // Lightweight re-render loop so the gradual growth size updates visibly.
  useEffect(() => {
    const t = setInterval(() => setTickNow(n => n + 1), 2000);
    return () => clearInterval(t);
  }, []);

  // Clear the one-time "just ripened" flag shortly after it triggers.
  useEffect(() => {
    const anyJust = slots.some(s => s.justRipened);
    if (!anyJust) return;
    const t = setTimeout(() => {
      setSlots(prev => prev.map(s => s.justRipened ? { ...s, justRipened: false } : s));
    }, 1000);
    return () => clearTimeout(t);
  }, [slots]);

  function resetSlot(index) {
    const now = Date.now();
    const ripenDur = randomRipenTime();
    setSlots(prev => prev.map((s, i) => i === index ? {
      phase: 'unripe',
      startedAt: now,
      ripenAt: now + ripenDur,
      ripeUntil: null,
      justRipened: false,
      anim: null
    } : s));
  }

  useEffect(() => {
    const timers = [];
    slots.forEach((s, i) => {
      if (s.anim === 'falling') {
        timers.push(setTimeout(() => resetSlot(i), 1000));
      } else if (s.anim === 'claimed') {
        timers.push(setTimeout(() => resetSlot(i), 400));
      }
    });
    return () => timers.forEach(clearTimeout);
  }, [slots]);

  function claim(index) {
    const s = slotsRef.current[index];
    if (!s || s.phase !== 'ripe' || s.anim) return;
    setCount(c => c + 1);
    setSlots(prev => prev.map((sl, i) => i === index ? { ...sl, anim: 'claimed' } : sl));
  }

  return e('div', { className: 'tree-scene' },
    e(LevelBanner, { title: 'COCONUTS FROM THE PALM TREE', instructions: 'CLICK RIPE COCONUTS TO PICK' }),
    e('div', { className: 'coconut-counter' }, 'COCONUTS: ' + count),
    e('div', { className: 'palm' },
      e('div', { className: 'base-1' }),
      e('div', { className: 'base-2' }),
      e('div', { className: 'trunk' }),
      e('div', { className: 'crown' },
        e('div', { className: 'frond f1' }),
        e('div', { className: 'frond f2' }),
        e('div', { className: 'frond f3' }),
        e('div', { className: 'frond f4' }),
        e('div', { className: 'frond f5' }),
        e('div', { className: 'frond f6' }),
        e('div', { className: 'crown-center' })
      )
    ),
    slots.map((s, i) => {
      // Coconut grows from a small nub to full size over its ripen duration,
      // and stays full-size through the ripe window. Ripe and fully-grown
      // unripe coconuts look nearly identical on purpose.
      const now = Date.now();
      const MIN_SIZE = 8, MAX_SIZE = 28;
      let sizePx;
      if (s.phase === 'unripe') {
        const total = s.ripenAt - s.startedAt;
        const frac = Math.max(0, Math.min(1, (now - s.startedAt) / total));
        sizePx = MIN_SIZE + (MAX_SIZE - MIN_SIZE) * frac;
      } else {
        sizePx = MAX_SIZE;
      }
      return e(Coconut, {
        key: i,
        slot: SLOT_POSITIONS[i],
        phase: s.phase,
        justRipened: s.justRipened,
        anim: s.anim,
        sizePx: sizePx,
        onClaim: () => claim(i)
      });
    }),
    e('div', { className: 'ground' })
  );
}

function App() {
  const [screen, setScreen] = useState('menu');
  const [count, setCount] = useState(0);
  const [ripples, setRipples] = useState([]);
  const appRef = useRef(null);

  function handleGlobalClick(ev) {
    const id = Math.random().toString(36).slice(2);
    const rect = appRef.current.getBoundingClientRect();
    const x = ev.clientX - rect.left;
    const y = ev.clientY - rect.top;
    setRipples(r => [...r, { id, x, y }]);
    setTimeout(() => setRipples(r => r.filter(rp => rp.id !== id)), 400);
  }

  let content;
  if (screen === 'menu') {
    content = e('div', { className: 'screen' },
      e('div', { className: 'arcade-title-wrap' },
        e('h1', { className: 'arcade-title', 'data-text': 'COCONUTS FROM THE PALM TREE' }, 'COCONUTS FROM THE PALM TREE')
      ),
      e('div', { className: 'insert-coin' }, 'PRESS START'),
      e('button', { className: 'btn', onClick: () => setScreen('game') }, 'Start')
    );
  } else if (screen === 'game') {
    content = e(GameScreen, { count, setCount });
  }

  return e('div', { id: 'app', ref: appRef, onClick: handleGlobalClick },
    content,
    ripples.map(rp => e('div', {
      key: rp.id,
      className: 'click-ripple',
      style: { left: rp.x + 'px', top: rp.y + 'px' }
    }))
  );
}

ReactDOM.createRoot(document.getElementById('app')).render(e(App));
</script>
</body>
</html>
