<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Click the Box</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #000000;
    color: #ffffff;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #app {
    width: 100%;
    height: 100%;
    position: relative;
  }
  .screen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 24px;
    text-align: center;
  }
  h1 { font-size: 28px; margin: 0; letter-spacing: 0.05em; }
  p { color: #bbbbbb; margin: 0; max-width: 420px; }
  .btn {
    background: #ffffff;
    color: #000000;
    border: 1px solid #ffffff;
    padding: 12px 24px;
    border-radius: 4px;
    font-size: 16px;
    cursor: pointer;
  }
  .btn:hover { background: #cccccc; }
  .btn.secondary { background: #000000; color: #ffffff; border: 1px solid #ffffff; }
  .btn.secondary:hover { background: #1a1a1a; }
  .diffRow { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .box {
    position: absolute;
    width: 60px;
    height: 60px;
    background: #ffffff;
    border-radius: 4px;
    cursor: pointer;
  }
  .box:hover { background: #dddddd; }
  .levelLabel {
    position: absolute;
    top: 16px;
    left: 16px;
    font-size: 14px;
    color: #777777;
  }
  .quitBtn {
    position: absolute;
    top: 16px;
    right: 16px;
  }
</style>
</head>
<body>
<div id="app"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script>
const { useState, useEffect, useRef } = React;
const e = React.createElement;

function Box({ x, y, onClick, size = 60 }) {
  return e('div', {
    className: 'box',
    style: { left: x + 'px', top: y + 'px', width: size + 'px', height: size + 'px' },
    onClick
  });
}

function randomPos(areaW, areaH, size) {
  return {
    x: Math.random() * Math.max(1, areaW - size),
    y: Math.random() * Math.max(1, areaH - size)
  };
}

function App() {
  const [screen, setScreen] = useState('menu'); // menu, difficulty, game, win, lose, gameover
  const [difficulty, setDifficulty] = useState(null);
  const [level, setLevel] = useState(1);
  const appRef = useRef(null);

  function startGame(diff) {
    setDifficulty(diff);
    setLevel(1);
    setScreen('game');
  }

  function onLevelComplete() {
    if (level >= 3) {
      setScreen('win');
    } else {
      setLevel(level + 1);
    }
  }

  function onFail() {
    setScreen('lose');
  }

  function backToMenu() {
    setScreen('menu');
    setDifficulty(null);
    setLevel(1);
  }

  let content;
  if (screen === 'menu') {
    content = e('div', { className: 'screen' },
      e('h1', null, 'Click the Box'),
      e('button', { className: 'btn', onClick: () => setScreen('difficulty') }, 'Start')
    );
  } else if (screen === 'difficulty') {
    content = e('div', { className: 'screen' },
      e('h1', null, 'Choose Difficulty'),
      e('div', { className: 'diffRow' },
        e('button', { className: 'btn', onClick: () => startGame('easy') }, 'Easy'),
        e('button', { className: 'btn', onClick: () => startGame('normal') }, 'Normal'),
        e('button', { className: 'btn', onClick: () => startGame('hard') }, 'Hard')
      ),
      e('button', { className: 'btn secondary', onClick: backToMenu }, 'Back')
    );
  } else if (screen === 'game') {
    content = e(GameScreen, {
      level, difficulty,
      onLevelComplete, onFail, onQuit: backToMenu
    });
  } else if (screen === 'win') {
    content = e('div', { className: 'screen' },
      e('h1', null, 'You Win'),
      e('button', { className: 'btn', onClick: backToMenu }, 'Play Again')
    );
  } else if (screen === 'lose') {
    content = e('div', { className: 'screen' },
      e('h1', null, 'Game Over'),
      e('button', { className: 'btn', onClick: backToMenu }, 'Try Again')
    );
  }

  return e('div', { id: 'app', ref: appRef }, content);
}

function GameScreen({ level, difficulty, onLevelComplete, onFail, onQuit }) {
  const containerRef = useRef(null);
  const [dims, setDims] = useState({ w: window.innerWidth, h: window.innerHeight });

  useEffect(() => {
    function onResize() { setDims({ w: window.innerWidth, h: window.innerHeight }); }
    window.addEventListener('resize', onResize);
    return () => window.removeEventListener('resize', onResize);
  }, []);

  return e('div', { ref: containerRef, style: { position: 'absolute', inset: 0 } },
    e('button', { className: 'btn secondary quitBtn', onClick: onQuit }, 'Quit'),
    level === 1 && e(Level1, { dims, onLevelComplete }),
    level === 2 && e(Level2, { dims, onLevelComplete }),
    level === 3 && e(Level3, { dims, difficulty, onLevelComplete, onFail })
  );
}

function Level1({ dims, onLevelComplete }) {
  const size = 60;
  const [pos] = useState(() => randomPos(dims.w, dims.h, size));
  return e(Box, { x: pos.x, y: pos.y, size, onClick: onLevelComplete });
}

function Level2({ dims, onLevelComplete }) {
  const size = 60;
  const [pos, setPos] = useState(() => randomPos(dims.w, dims.h, size));
  const velRef = useRef({ vx: (Math.random() > 0.5 ? 1 : -1) * 2.5, vy: (Math.random() > 0.5 ? 1 : -1) * 2.5 });
  const posRef = useRef(pos);

  useEffect(() => {
    let raf;
    function tick() {
      let { x, y } = posRef.current;
      let { vx, vy } = velRef.current;
      x += vx; y += vy;
      if (x <= 0 || x >= dims.w - size) { vx = -vx; x = Math.max(0, Math.min(x, dims.w - size)); }
      if (y <= 0 || y >= dims.h - size) { vy = -vy; y = Math.max(0, Math.min(y, dims.h - size)); }
      posRef.current = { x, y };
      velRef.current = { vx, vy };
      setPos({ x, y });
      raf = requestAnimationFrame(tick);
    }
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [dims.w, dims.h]);

  return e(Box, { x: pos.x, y: pos.y, size, onClick: onLevelComplete });
}

// Level 3: pick a random target time within range based on difficulty.
// Box appears exactly at that time, stays 5s, then vanishes if unclicked.
// No feedback on miss — game simply ends (handled by parent via onFail after window closes).
function Level3({ dims, difficulty, onLevelComplete, onFail }) {
  const size = 60;
  const [targetTime] = useState(() => {
    const now = Date.now();
    let maxOffsetMs;
    if (difficulty === 'easy') {
      // sometime later today (up to end of day, fallback to next 24h if past midnight edge)
      const endOfDay = new Date();
      endOfDay.setHours(23, 59, 59, 999);
      maxOffsetMs = Math.max(5000, endOfDay.getTime() - now);
    } else if (difficulty === 'normal') {
      maxOffsetMs = 365 * 24 * 60 * 60 * 1000; // up to a year
    } else {
      maxOffsetMs = 100 * 365 * 24 * 60 * 60 * 1000; // up to 100 years
    }
    const offset = Math.random() * maxOffsetMs;
    return now + offset;
  });

  const [boxVisible, setBoxVisible] = useState(false);
  const [pos, setPos] = useState(() => randomPos(dims.w, dims.h, size));
  const resolvedRef = useRef(false);

  useEffect(() => {
    let showTimer, hideTimer, checkInterval;

    const msUntil = targetTime - Date.now();

    function showBox() {
      if (resolvedRef.current) return;
      setPos(randomPos(dims.w, dims.h, size));
      setBoxVisible(true);
      hideTimer = setTimeout(() => {
        setBoxVisible(false);
        if (!resolvedRef.current) {
          resolvedRef.current = true;
          onFail();
        }
      }, 5000);
    }

    if (msUntil <= 0) {
      showBox();
    } else {
      showTimer = setTimeout(showBox, msUntil);
    }

    return () => {
      clearTimeout(showTimer);
      clearTimeout(hideTimer);
      clearInterval(checkInterval);
    };
  }, [targetTime, dims.w, dims.h, onFail]);

  function handleClick() {
    if (resolvedRef.current) return;
    resolvedRef.current = true;
    setBoxVisible(false);
    onLevelComplete();
  }

  return e(React.Fragment, null,
    !boxVisible && e('div', { className: 'screen' }),
    boxVisible && e(Box, { x: pos.x, y: pos.y, size, onClick: handleClick })
  );
}

ReactDOM.createRoot(document.getElementById('app')).render(e(App));
</script>
</body>
</html>
