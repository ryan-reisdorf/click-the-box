<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Click the Box</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Press Start 2P', monospace;
    background: #000000;
    color: #ffffff;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    image-rendering: pixelated;
  }
  #app {
    width: 100%;
    height: 100%;
    position: relative;
  }
  #app::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.05) 0px,
      rgba(255,255,255,0.05) 1px,
      transparent 1px,
      transparent 3px
    );
    mix-blend-mode: overlay;
    z-index: 50;
  }
  .screen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    padding: 24px;
    text-align: center;
  }
  h1 {
    font-size: 28px;
    margin: 0;
    letter-spacing: 0.08em;
  }
  p { color: #bbbbbb; margin: 0; max-width: 420px; font-size: 12px; line-height: 1.8; }
  .btn {
    font-family: 'Press Start 2P', monospace;
    background: #000000;
    color: #ffffff;
    border: 3px solid #ffffff;
    padding: 14px 22px;
    border-radius: 0;
    font-size: 13px;
    cursor: pointer;
    box-shadow: 4px 4px 0 #ffffff;
    transition: transform 0.05s ease;
  }
  .btn:hover { background: #ffffff; color: #000000; }
  .btn:active { transform: translate(4px, 4px); box-shadow: 0 0 0 #ffffff; }
  .btn.secondary { background: #000000; color: #ffffff; }
  .btn.secondary:hover { background: #1a1a1a; color: #ffffff; }
  .diffRow { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
  .box {
    position: absolute;
    width: 60px;
    height: 60px;
    background: #ffffff;
    border-radius: 0;
    cursor: pointer;
    box-shadow:
      0 0 0 3px #000000,
      0 0 0 6px #ffffff;
  }
  .box:hover { background: #dddddd; }
  .levelLabel {
    position: absolute;
    top: 16px;
    left: 16px;
    font-size: 14px;
    color: #777777;
  }
  .quitBtn {
    position: absolute;
    top: 16px;
    right: 16px;
  }

  /* --- 8-bit title effect --- */
  .arcade-title-wrap {
    position: relative;
    line-height: 1.6;
  }
  .arcade-title {
    font-size: 32px;
    margin: 0;
    color: #ffffff;
    letter-spacing: 0.12em;
    position: relative;
    display: inline-block;
    animation: flicker 4s infinite steps(1);
    text-shadow:
      3px 0 0 #000000,
      -3px 0 0 #000000,
      0 3px 0 #000000,
      0 -3px 0 #000000,
      4px 4px 0 #ffffff;
  }
  .arcade-title::before,
  .arcade-title::after {
    content: attr(data-text);
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    overflow: hidden;
    color: #ffffff;
  }
  .arcade-title::before {
    animation: glitchTop 5s infinite linear;
    clip-path: inset(0 0 60% 0);
    transform: translate(-2px, -1px);
  }
  .arcade-title::after {
    animation: glitchBottom 6s infinite linear;
    clip-path: inset(60% 0 0 0);
    transform: translate(2px, 1px);
  }
  @keyframes flicker {
    0%, 92%, 100% { opacity: 1; }
    93% { opacity: 0.3; }
    94% { opacity: 1; }
    95% { opacity: 0.5; }
    96% { opacity: 1; }
  }
  @keyframes glitchTop {
    0%, 89%, 100% { transform: translate(-2px, -1px); opacity: 0; }
    90% { transform: translate(-6px, -2px); opacity: 0.8; }
    91% { transform: translate(3px, -1px); opacity: 0.8; }
    92% { transform: translate(-2px, -1px); opacity: 0; }
  }
  @keyframes glitchBottom {
    0%, 79%, 100% { transform: translate(2px, 1px); opacity: 0; }
    80% { transform: translate(6px, 2px); opacity: 0.8; }
    81% { transform: translate(-3px, 1px); opacity: 0.8; }
    82% { transform: translate(2px, 1px); opacity: 0; }
  }
  .blink-cursor {
    display: inline-block;
    width: 14px;
    height: 28px;
    background: #ffffff;
    margin-left: 10px;
    vertical-align: middle;
    animation: cursorBlink 1s steps(1) infinite;
  }
  @keyframes cursorBlink {
    0%, 50% { opacity: 1; }
    50.01%, 100% { opacity: 0; }
  }
  .insert-coin {
    font-size: 11px;
    color: #ffffff;
    margin-top: -6px;
    animation: coinBlink 1.2s steps(1) infinite;
    letter-spacing: 0.15em;
  }
  @keyframes coinBlink {
    0%, 50% { opacity: 1; }
    50.01%, 100% { opacity: 0.15; }
  }
  .fact-text {
    position: absolute;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    max-width: 80vw;
    font-size: 11px;
    color: #ffffff;
    text-align: center;
    line-height: 1.7;
    letter-spacing: 0.04em;
    padding: 14px 18px;
    border: 2px solid #ffffff;
    background: #000000;
    box-shadow: 4px 4px 0 #ffffff;
    animation: factFade 0.3s steps(2);
  }
  @keyframes factFade {
    0% { opacity: 0; }
    100% { opacity: 1; }
  }
  .level-banner {
    position: absolute;
    top: 32px;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    z-index: 20;
  }
  .level-banner .banner-title {
    font-size: 16px;
    letter-spacing: 0.15em;
    color: #ffffff;
    border: 2px solid #ffffff;
    padding: 10px 18px;
    background: #000000;
    box-shadow: 3px 3px 0 #ffffff;
  }
  .level-banner .banner-instructions {
    margin-top: 14px;
    font-size: 10px;
    color: #bbbbbb;
    letter-spacing: 0.05em;
  }
  .click-ripple {
    position: absolute;
    width: 10px;
    height: 10px;
    border: 2px solid #ffffff;
    pointer-events: none;
    transform: translate(-50%, -50%);
    z-index: 999;
    animation: rippleOut 0.35s ease-out forwards;
  }
  @keyframes rippleOut {
    0% { width: 6px; height: 6px; opacity: 1; }
    100% { width: 36px; height: 36px; opacity: 0; }
  }
</style>
</head>
<body>
<div id="app"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="facts.js"></script>
<script>
const { useState, useEffect, useRef } = React;
const e = React.createElement;

function Box({ x, y, onClick, size = 60 }) {
  return e('div', {
    className: 'box',
    style: { left: x + 'px', top: y + 'px', width: size + 'px', height: size + 'px' },
    onClick
  });
}

function randomPos(areaW, areaH, size) {
  return {
    x: Math.random() * Math.max(1, areaW - size),
    y: Math.random() * Math.max(1, areaH - size)
  };
}

function App() {
  const [screen, setScreen] = useState('menu'); // menu, difficulty, game, win
  const [difficulty, setDifficulty] = useState(null);
  const [level, setLevel] = useState(1);
  const [ripples, setRipples] = useState([]);
  const appRef = useRef(null);

  function handleGlobalClick(ev) {
    const id = Math.random().toString(36).slice(2);
    const rect = appRef.current.getBoundingClientRect();
    const x = ev.clientX - rect.left;
    const y = ev.clientY - rect.top;
    setRipples(r => [...r, { id, x, y }]);
    setTimeout(() => {
      setRipples(r => r.filter(rp => rp.id !== id));
    }, 400);
  }

  function startGame(diff) {
    setDifficulty(diff);
    setLevel(1);
    setScreen('game');
  }

  function onLevelComplete() {
    if (level >= 3) {
      setScreen('win');
    } else {
      setLevel(level + 1);
    }
  }

  function onFail() {
    backToMenu();
  }

  function backToMenu() {
    setScreen('menu');
    setDifficulty(null);
    setLevel(1);
  }

  let content;
  if (screen === 'menu') {
    content = e('div', { className: 'screen' },
      e('div', { className: 'arcade-title-wrap' },
        e('h1', { className: 'arcade-title', 'data-text': 'CLICK THE BOX' }, 'CLICK THE BOX')
      ),
      e('div', { className: 'insert-coin' }, 'PRESS START'),
      e('button', { className: 'btn', onClick: () => setScreen('difficulty') }, 'Start')
    );
  } else if (screen === 'difficulty') {
    content = e('div', { className: 'screen' },
      e('h1', null, 'Choose Difficulty'),
      e('div', { className: 'diffRow' },
        e('button', { className: 'btn', onClick: () => startGame('easy') }, 'Easy'),
        e('button', { className: 'btn', onClick: () => startGame('normal') }, 'Normal'),
        e('button', { className: 'btn', onClick: () => startGame('hard') }, 'Hard')
      ),
      e('button', { className: 'btn secondary', onClick: backToMenu }, 'Back')
    );
  } else if (screen === 'game') {
    content = e(GameScreen, {
      level, difficulty,
      onLevelComplete, onFail, onQuit: backToMenu
    });
  } else if (screen === 'win') {
    content = e('div', { className: 'screen' },
      e('h1', null, 'You Win'),
      e('button', { className: 'btn', onClick: backToMenu }, 'Play Again')
    );
  }

  return e('div', { id: 'app', ref: appRef, onClick: handleGlobalClick },
    content,
    ripples.map(rp => e('div', {
      key: rp.id,
      className: 'click-ripple',
      style: { left: rp.x + 'px', top: rp.y + 'px' }
    }))
  );
}

function GameScreen({ level, difficulty, onLevelComplete, onFail, onQuit }) {
  const containerRef = useRef(null);
  const [dims, setDims] = useState({ w: window.innerWidth, h: window.innerHeight });

  useEffect(() => {
    function onResize() { setDims({ w: window.innerWidth, h: window.innerHeight }); }
    window.addEventListener('resize', onResize);
    return () => window.removeEventListener('resize', onResize);
  }, []);

  return e('div', { ref: containerRef, style: { position: 'absolute', inset: 0 } },
    level === 1 && e(Level1, { dims, onLevelComplete }),
    level === 2 && e(Level2, { dims, onLevelComplete }),
    level === 3 && e(Level3, { dims, difficulty, onLevelComplete, onFail })
  );
}

function LevelBanner({ title, instructions }) {
  return e('div', { className: 'level-banner' },
    e('div', { className: 'banner-title' }, title),
    instructions && e('div', { className: 'banner-instructions' }, instructions)
  );
}

function Level1({ dims, onLevelComplete }) {
  const size = 60;
  const pos = { x: dims.w / 2 - size / 2, y: dims.h / 2 - size / 2 };
  return e(React.Fragment, null,
    e(LevelBanner, { title: 'LEVEL 1', instructions: 'CLICK THE BOX TO CONTINUE' }),
    e(Box, { x: pos.x, y: pos.y, size, onClick: onLevelComplete })
  );
}

function Level2({ dims, onLevelComplete }) {
  const size = 60;
  const center = { x: dims.w / 2 - size / 2, y: dims.h / 2 - size / 2 };
  const [pos, setPos] = useState(center);
  const velRef = useRef({ vx: (Math.random() > 0.5 ? 1 : -1) * 2.5, vy: (Math.random() > 0.5 ? 1 : -1) * 2.5 });
  const posRef = useRef(center);

  useEffect(() => {
    let raf;
    function tick() {
      let { x, y } = posRef.current;
      let { vx, vy } = velRef.current;
      x += vx; y += vy;
      if (x <= 0 || x >= dims.w - size) { vx = -vx; x = Math.max(0, Math.min(x, dims.w - size)); }
      if (y <= 0 || y >= dims.h - size) { vy = -vy; y = Math.max(0, Math.min(y, dims.h - size)); }
      posRef.current = { x, y };
      velRef.current = { vx, vy };
      setPos({ x, y });
      raf = requestAnimationFrame(tick);
    }
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [dims.w, dims.h]);

  return e(React.Fragment, null,
    e(LevelBanner, { title: 'LEVEL 2' }),
    e(Box, { x: pos.x, y: pos.y, size, onClick: onLevelComplete })
  );
}

// Level 3: pick a random target time within range based on difficulty.
// Box appears exactly at that time, stays 5s, then vanishes if unclicked.
// No feedback on miss — game simply ends (handled by parent via onFail after window closes).
function Level3({ dims, difficulty, onLevelComplete, onFail }) {
  const size = 60;
  const [targetTime] = useState(() => {
    const now = Date.now();
    let maxOffsetMs;
    if (difficulty === 'easy') {
      // sometime later today (up to end of day, fallback to next 24h if past midnight edge)
      const endOfDay = new Date();
      endOfDay.setHours(23, 59, 59, 999);
      maxOffsetMs = Math.max(5000, endOfDay.getTime() - now);
    } else if (difficulty === 'normal') {
      maxOffsetMs = 365 * 24 * 60 * 60 * 1000; // up to a year
    } else {
      maxOffsetMs = 100 * 365 * 24 * 60 * 60 * 1000; // up to 100 years
    }
    const offset = Math.random() * maxOffsetMs;
    return now + offset;
  });

  const [boxVisible, setBoxVisible] = useState(false);
  const [pos, setPos] = useState(() => randomPos(dims.w, dims.h, size));
  const [currentFact, setCurrentFact] = useState(null);
  const resolvedRef = useRef(false);
  const boxVisibleRef = useRef(false);

  useEffect(() => { boxVisibleRef.current = boxVisible; }, [boxVisible]);

  // Random flavor facts during the wait — hard mode only. Purely cosmetic,
  // never tied to timing/position, so they give no real gameplay info.
  useEffect(() => {
    if (difficulty !== 'hard') return;
    let showTimeout, hideTimeout;

    function scheduleNextFact() {
      const delay = 15 * 60 * 1000 + Math.random() * 5 * 60 * 1000; // 15–20 min between facts
      showTimeout = setTimeout(() => {
        if (resolvedRef.current || boxVisibleRef.current) { scheduleNextFact(); return; }
        const fact = FACTS[Math.floor(Math.random() * FACTS.length)];
        setCurrentFact(fact);
        const displayTime = 3500 + Math.random() * 2500; // 3.5–6s shown
        hideTimeout = setTimeout(() => {
          setCurrentFact(null);
          scheduleNextFact();
        }, displayTime);
      }, delay);
    }

    scheduleNextFact();
    return () => {
      clearTimeout(showTimeout);
      clearTimeout(hideTimeout);
    };
  }, [difficulty]);

  // Hide any visible fact the instant the box appears.
  useEffect(() => {
    if (boxVisible) setCurrentFact(null);
  }, [boxVisible]);

  useEffect(() => {
    let showTimer, hideTimer, checkInterval;

    const msUntil = targetTime - Date.now();

    function showBox() {
      if (resolvedRef.current) return;
      setPos(randomPos(dims.w, dims.h, size));
      setBoxVisible(true);
      hideTimer = setTimeout(() => {
        setBoxVisible(false);
        if (!resolvedRef.current) {
          resolvedRef.current = true;
          onFail();
        }
      }, 5000);
    }

    if (msUntil <= 0) {
      showBox();
    } else {
      showTimer = setTimeout(showBox, msUntil);
    }

    return () => {
      clearTimeout(showTimer);
      clearTimeout(hideTimer);
      clearInterval(checkInterval);
    };
  }, [targetTime, dims.w, dims.h, onFail]);

  function handleClick() {
    if (resolvedRef.current) return;
    resolvedRef.current = true;
    setBoxVisible(false);
    onLevelComplete();
  }

  return e(React.Fragment, null,
    e(LevelBanner, { title: 'LEVEL 3' }),
    !boxVisible && e('div', { className: 'screen' }),
    !boxVisible && currentFact && e('div', { className: 'fact-text' }, currentFact),
    boxVisible && e(Box, { x: pos.x, y: pos.y, size, onClick: handleClick })
  );
}

ReactDOM.createRoot(document.getElementById('app')).render(e(App));
</script>
</body>
</html>
